<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orka og afl – stigaspil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDEA; --surface:#FFFFFF; --ink:#17242B; --muted:#56666C; --line:#BDC8C4;
  --l1:#2F7F60; --on1:#FFFFFF;
  --l3:#D99B1C; --on3:#17242B;
  --l5:#B8412B; --on5:#FFFFFF;
  --ok:#2F7F60; --bad:#B8412B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131A1D; --surface:#1C262A; --ink:#E4EBE8; --muted:#9CACB0; --line:#34434A;
    --l1:#3E9E78; --l3:#E5AA2E; --l5:#D5573F; --ok:#5CC095; --bad:#EE7A63;
  }
}
:root[data-theme="dark"]{
  --bg:#131A1D; --surface:#1C262A; --ink:#E4EBE8; --muted:#9CACB0; --line:#34434A;
  --l1:#3E9E78; --l3:#E5AA2E; --l5:#D5573F; --ok:#5CC095; --bad:#EE7A63;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 1.0625rem/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:46rem;margin:0 auto;padding:1.25rem 1.25rem 3rem}
.disp{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif}

/* header */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;
  padding-bottom:.75rem;border-bottom:2px solid var(--ink)}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.score{display:flex;gap:1.5rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.5rem;color:var(--ink);margin-left:.35rem}

h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
  font-size:clamp(2rem,6.5vw,3.25rem);line-height:1.02;letter-spacing:-.025em;margin:2rem 0 .75rem;max-width:16ch}
.lede{color:var(--muted);max-width:36rem;margin:0}
.note{margin:1rem 0 0;font-weight:700}

/* platforms */
.stage{margin-top:2.25rem}
.platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.5rem,3vw,1.5rem);
  align-items:end;height:clamp(240px,44vh,340px)}
.plat{appearance:none;border:0;font:inherit;cursor:pointer;
  background:var(--c);color:var(--on);border-radius:8px 8px 0 0;
  display:flex;align-items:flex-start;justify-content:flex-start;gap:.4rem;
  padding:.8rem .9rem;text-align:left;transition:transform .18s ease}
.plat[data-l="1"]{--c:var(--l1);--on:var(--on1);height:34%}
.plat[data-l="3"]{--c:var(--l3);--on:var(--on3);height:64%}
.plat[data-l="5"]{--c:var(--l5);--on:var(--on5);height:100%}
.plat .n{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
  font-size:clamp(2.6rem,10vw,4.25rem);line-height:.85}
.plat .t{font-weight:700;padding-top:.2rem}
.plat:hover:not(:disabled){transform:translateY(-6px)}
.plat:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.plat:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.ground{height:14px;border-top:3px solid var(--ink);
  background:repeating-linear-gradient(-45deg,var(--ink) 0 1.5px,transparent 1.5px 8px);opacity:.85}
.caps{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.5rem,3vw,1.5rem);margin-top:.75rem}
.caps strong{display:block}
.caps span{color:var(--muted);font-size:.9375rem}

.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:2.5rem}

/* buttons */
.btn{appearance:none;font:inherit;font-weight:700;cursor:pointer;border-radius:8px;
  padding:.7rem 1.2rem;border:2px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--c,var(--l1));outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{appearance:none;border:0;background:none;font:inherit;color:var(--muted);text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;padding:.25rem}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1.75rem}
.chip{background:var(--c);color:var(--on);font-weight:700;border-radius:999px;padding:.3rem .9rem}
.qtext{font-size:clamp(1.2rem,3.4vw,1.45rem);line-height:1.45;margin:1.25rem 0 1.75rem;max-width:38rem}
.ans label{display:block;font-weight:700;margin-bottom:.4rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
input{font:inherit;font-size:1.2rem;flex:1 1 12rem;min-width:0;padding:.65rem .8rem;border-radius:8px;
  border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus{border-color:var(--c)}
.small{color:var(--muted);font-size:.9rem;margin:.5rem 0 0}
.opts{display:grid;gap:.6rem;max-width:34rem}
.opt{appearance:none;font:inherit;text-align:left;cursor:pointer;padding:.8rem 1rem;border-radius:8px;
  border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.wrong{text-decoration:line-through;opacity:.55}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.opt:disabled{cursor:default}

/* feedback */
#fb{margin-top:1.5rem}
.fb{border-radius:10px;padding:1.1rem 1.2rem;background:var(--surface);border-left:6px solid var(--line)}
.fb.ok{border-left-color:var(--ok)}
.fb.bad{border-left-color:var(--bad)}
.fb .big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.35rem;margin:0 0 .4rem}
.fb.ok .big{color:var(--ok)} .fb.bad .big{color:var(--bad)}
.fb p{margin:.25rem 0}
.hint{margin:.8rem 0 1rem;padding:.7rem .9rem;border-radius:8px;border:1.5px dashed var(--c)}
.hint p{margin:.2rem 0 0}
.sol{font-variant-numeric:tabular-nums;overflow-x:auto}
.fb .btn{margin-top:.9rem}
.msg{color:var(--bad);font-weight:700;margin:.5rem 0 0}

/* end */
.total{display:flex;align-items:baseline;gap:.6rem;margin:.5rem 0 1.5rem}
.total .n{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(4rem,16vw,7rem);line-height:.9}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;max-width:32rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:400}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.5rem;background:var(--c)}
.log{list-style:none;padding:0;margin:1.75rem 0 0;max-width:38rem}
.log li{display:grid;grid-template-columns:1.6rem 3.4rem 1fr;gap:.4rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.log .ok{color:var(--ok);font-weight:700} .log .no{color:var(--bad);font-weight:700}
.log .lv{color:var(--muted)}

@media (max-width:420px){
  .plat{padding:.6rem}
  .plat .t{display:none}
  .caps span{font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Orka og afl</div>
    <div class="score" aria-live="polite"><span>Stig<b id="sc">0</b></span><span>Svarað<b id="nc">0</b></span></div>
  </header>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   SPURNINGABANKINN
   Til að breyta eða bæta við spurningu: afritaðu eina færslu.
   type: "num"  = tölusvar (answers: listi af réttum tölum)
         "choice" = valmöguleikar (options + correct)
   Tölusvör eru samþykkt ef þau eru innan 2,5 % frá réttu svari.
   ============================================================ */
const BANK = {
  1: [
    {id:"1-1", type:"num", text:"Nemandi lyftir 15 kg bakpoka upp í 1,2 metra hæð. Hversu mikla vinnu vann nemandinn?",
     answers:[176.4], unit:"J",
     hints:["Vinnan við að lyfta hlut er jöfn stöðuorkunni sem hann fær: W = m·g·h.","Settu inn m = 15 kg, g = 9,8 m/s² og h = 1,2 m."],
     sol:"W = m·g·h = 15 · 9,8 · 1,2 ≈ 176 J"},
    {id:"1-2", type:"num", text:"Nemandi hleypur upp 10 m háan hringstiga á 25 s. Massi nemandans er 55 kg. Hvert er afl nemandans?",
     answers:[215.6], unit:"W",
     hints:["Afl er vinna á tímaeiningu: P = W / t.","Reiknaðu fyrst vinnuna W = m·g·h = 55 · 9,8 · 10 og deildu svo með 25 s."],
     sol:"W = 55 · 9,8 · 10 = 5390 J  →  P = 5390 / 25 = 215,6 W"},
    {id:"1-3", type:"num", text:"Bolti fellur niður af 3 m háu húsþaki. Hver verður hraði boltans þegar hann lendir?",
     answers:[7.67], unit:"m/s",
     hints:["Stöðuorkan breytist í hreyfiorku: m·g·h = ½·m·v². Massinn styttist út.","Einangraðu v: v = √(2·g·h)."],
     sol:"v = √(2 · 9,8 · 3) = √58,8 ≈ 7,7 m/s"},
    {id:"1-4", type:"num", text:"3 kg kassi er dreginn 15 metra eftir hrjúfu gólfi með núningsstuðulinn 0,27. Hve mikil er vinna núningskraftsins?",
     answers:[119.07], unit:"J",
     hints:["Núningskrafturinn er F = μ·m·g.","Vinna núningskraftsins er W = F·s, þar sem s = 15 m."],
     sol:"F = 0,27 · 3 · 9,8 ≈ 7,94 N  →  W = 7,94 · 15 ≈ 119 J"},
    {id:"1-5", type:"num", text:"Kassi (18 kg) fullur af jólaskrauti stendur uppi á hillu í 2,2 metra hæð. Hver er stöðuorka kassans?",
     answers:[388.08], unit:"J",
     hints:["Stöðuorka: Ep = m·g·h.","Settu inn m = 18 kg og h = 2,2 m."],
     sol:"Ep = 18 · 9,8 · 2,2 ≈ 388 J"},
    {id:"1-6", type:"num", text:"Gormur með fjaðurstuðulinn 450 N/m er þjappaður um 6,0 cm. Hversu mikla fjaðurorku geymir gormurinn?",
     answers:[0.81], unit:"J",
     hints:["Fjaðurorka: E = ½·k·x².","Mundu að breyta cm í metra: 6,0 cm = 0,060 m."],
     sol:"E = ½ · 450 · 0,060² = 0,81 J"},
    {id:"1-7", type:"choice", text:"Þegar bolti fellur niður af borði eykst hreyfiorka hans og stöðuorka minnkar.",
     options:[{v:"satt",t:"Satt"},{v:"osatt",t:"Ósatt"}], correct:"satt",
     hints:["Hugsaðu um hvað gerist við hæð boltans og hraða hans á leiðinni niður."],
     sol:"Hæðin minnkar, svo stöðuorkan minnkar. Hraðinn eykst, svo hreyfiorkan eykst. Fullyrðingin er sönn."}
  ],
  3: [
    {id:"3-1", type:"num", text:"Bolti (0,25 kg) fellur úr 4,5 metra hæð. Hver er hraði boltans rétt fyrir lendingu?",
     answers:[9.39], unit:"m/s",
     hints:["Orkuvarðveisla: stöðuorkan efst verður að hreyfiorku neðst.","v = √(2·g·h). Skiptir massinn máli?"],
     sol:"v = √(2 · 9,8 · 4,5) = √88,2 ≈ 9,4 m/s (massinn styttist út)"},
    {id:"3-2", type:"num", text:"Hjólreiðamaður beitir 150 N krafti á pedalana meðan hann hreyfir sig áfram á hraðanum 6,0 m/s. Hvert er afl hjólreiðamannsins?",
     answers:[900], unit:"W",
     hints:["Afl má líka skrifa sem P = F·v.","P = 150 N · 6,0 m/s."],
     sol:"P = F·v = 150 · 6,0 = 900 W"},
    {id:"3-3", type:"num", text:"Vél gefur af sér 950 W afl í 12 sekúndur. Hversu mikla vinnu vann vélin á þessum tíma?",
     answers:[11400], unit:"J",
     hints:["Afl er vinna á tímaeiningu, svo W = P·t.","W = 950 W · 12 s."],
     sol:"W = P·t = 950 · 12 = 11 400 J"},
    {id:"3-4", type:"num", text:"Kassi (10 kg) er dreginn 20 m eftir gólfi með núningsstuðli 0,22. Hver er vinna núningsins?",
     answers:[431.2], unit:"J",
     hints:["Núningskrafturinn er F = μ·m·g.","W = μ·m·g·s með s = 20 m."],
     sol:"W = 0,22 · 10 · 9,8 · 20 = 431,2 J"},
    {id:"3-5", type:"num", text:"Maður skýtur litlum bolta úr gormi. Fjaðurstuðull gormsins er 1100 N/m og hann þjappar gorminum saman um 9 cm. Hver er upphafshraði boltans þegar hann losnar frá gorminum ef boltinn er 0,35 kg?",
     answers:[5.045], unit:"m/s",
     hints:["Fjaðurorkan breytist í hreyfiorku: ½·k·x² = ½·m·v².","Einangraðu v: v = x·√(k/m), með x = 0,09 m."],
     sol:"v = 0,09 · √(1100 / 0,35) ≈ 0,09 · 56,1 ≈ 5,05 m/s"},
    {id:"3-6", type:"choice", text:"Bjössi fríhjólar niður brekkuna frá Menntaskólanum niður að Bónus. Ef við gefum okkur að enginn núningskraftur sé til staðar, hver eftirfarandi svarmöguleika er þá sannur?",
     options:[{v:"a",t:"a) Vélræn orka Bjössa eykst"},{v:"b",t:"b) Vélræn orka Bjössa minnkar"},{v:"c",t:"c) Vélræn orka helst óbreytt"}], correct:"c",
     hints:["Vélræn orka = stöðuorka + hreyfiorka. Hvert ætti orkan að fara ef enginn núningur er?"],
     sol:"Án núnings varðveitist vélræn orka: stöðuorka breytist í hreyfiorku en summan helst sú sama. Rétt svar er c."}
  ],
  5: [
    {id:"5-1", type:"num", text:"Reiðhjólamaður (78 kg með hjóli) hjólar eftir láréttum hjólastíg. Núningskraftur milli hjóls og stígs er 25 N. Reiðhjólakappinn er kominn á hraðann 9,5 m/s áður en hann hættir að stíga hjólið. Hversu langt rennur hjólið áður en það stoppar?",
     answers:[140.8], unit:"m",
     hints:["Núningurinn vinnur á móti hreyfingunni þar til öll hreyfiorkan er horfin: F·s = ½·m·v².","Reiknaðu fyrst hreyfiorkuna ½ · 78 · 9,5² og deildu svo með 25 N."],
     sol:"Ek = ½ · 78 · 9,5² ≈ 3520 J  →  s = 3520 / 25 ≈ 140,8 m"},
    {id:"5-2", type:"num", text:"12 kg kassi er dreginn með 90 N krafti upp skáplan sem hallar um 35° frá láréttu. Núningsstuðull við yfirborðið er 0,20 og kassinn var kyrrstæður í upphafi. Hver er hraði hans eftir 20 m?",
     answers:[3.3], unit:"m/s",
     hints:["Teiknaðu kraftana: togkrafturinn upp skáplanið, þyngdarþátturinn m·g·sin35° niður skáplanið og núningurinn μ·m·g·cos35° líka niður.","Heildarkrafturinn sinnum 20 m gefur heildarvinnuna, og hún verður að hreyfiorku ½·m·v²."],
     sol:"m·g·sin35° ≈ 67,5 N, núningur ≈ 0,20 · 12 · 9,8 · cos35° ≈ 19,3 N. Heildarkraftur ≈ 90 − 67,5 − 19,3 ≈ 3,3 N. ½ · 12 · v² = 3,3 · 20  →  v ≈ 3,3 m/s"},
    {id:"5-3", type:"num", text:"Lítill rafmótor dregur 30,0 kg sleða eftir sléttu undirlagi. Núningur við sleðann er 70 N. Ef afl vélarinnar er 350 W, hver verður hraði sleðans ef hann ferðast með jöfnum hraða?",
     answers:[5], unit:"m/s",
     hints:["Jafn hraði þýðir að togkraftur mótorsins er jafn núningnum.","P = F·v, svo v = P / F."],
     sol:"v = P / F = 350 / 70 = 5 m/s"},
    {id:"5-4", type:"num", text:"Við rannsókn á umferðarslysi finnur lögreglan 105 m löng bremsuför. Út frá aðstæðum meta þeir að núningsstuðull milli bíls (2500 kg) og vegar sé 0,5. Á hvaða hraða var bíllinn þegar hann byrjaði að bremsa?",
     answers:[32.08], unit:"m/s",
     hints:["Öll hreyfiorka bílsins fer í vinnu núningsins: ½·m·v² = μ·m·g·s.","Massinn styttist út: v = √(2·μ·g·s)."],
     sol:"v = √(2 · 0,5 · 9,8 · 105) = √1029 ≈ 32,1 m/s"},
    {id:"5-5", type:"num", text:"Skíðamaður (75 kg) gengur með hraðanum 4,0 m/s þegar hann kemur að 10 m hárri og 39 m langri brekku niður á við (með hornið 14,9°). Hver er núningskrafturinn milli skíðamanns og yfirborðs ef hraði hans þegar hann hefur runnið niður brekkuna er 12 m/s?",
     answers:[65.4, 0.09], unit:"N",
     hints:["Orkubókhald: hreyfiorka í upphafi + stöðuorka efst = hreyfiorka neðst + vinna núnings.","Vinna núnings = F·s með s = 39 m. Reiknaðu hinar orkurnar þrjár og leystu fyrir F."],
     sol:"Ek1 = ½ · 75 · 4,0² = 600 J, Ep = 75 · 9,8 · 10 = 7350 J, Ek2 = ½ · 75 · 12² = 5400 J. Vinna núnings = 600 + 7350 − 5400 = 2550 J  →  F = 2550 / 39 ≈ 65 N (núningsstuðullinn er þá ≈ 0,09)"}
  ]
};
BANK[1].concat(BANK[3],BANK[5]).forEach(q=>{q.level=+q.id[0]});

const NAMES = {1:"Léttari", 3:"Miðlungs", 5:"Krefjandi"};
const TOL = 0.025;
const S = {score:0, log:[], used:new Set(), q:null, wrong:0};
const main = document.getElementById("main");

function remaining(l){ return BANK[l].filter(q=>!S.used.has(q.id)); }
function updateScore(){
  document.getElementById("sc").textContent = S.score;
  document.getElementById("nc").textContent = S.log.length;
}
function lvStyle(l){ return `--c:var(--l${l});--on:var(--on${l})`; }

/* ---------- forsíða ---------- */
function home(){
  const lv = [1,3,5];
  const allDone = lv.every(l=>!remaining(l).length);
  main.innerHTML = `
    <h1>Hvað veistu um orku og afl?</h1>
    <p class="lede">Spurningar gefa ýmist 1, 3 eða 5 stig eftir erfiðleikastigi. Prófaðu þig áfram og reyndu að meta hversu vel þú kannt efni 4. kafla kennslubókarinnar.</p>
    ${allDone ? '<p class="note">Þú hefur svarað öllum spurningunum í bankanum.</p>' : ''}
    <div class="stage">
      <div class="platforms">
        ${lv.map(l=>{const r=remaining(l).length;return `
          <button class="plat" data-l="${l}" ${r?'':'disabled'} aria-label="${l} stiga spurning, ${NAMES[l].toLowerCase()}, ${r} eftir">
            <span class="n">${l}</span><span class="t">stig</span>
          </button>`}).join("")}
      </div>
      <div class="ground" aria-hidden="true"></div>
      <div class="caps">
        ${lv.map(l=>{const r=remaining(l).length;return `<div><strong>${NAMES[l]}</strong><span>${r ? r+" eftir" : "Allar búnar"}</span></div>`}).join("")}
      </div>
    </div>
    <div class="actions"><button class="btn ghost" id="quit">Hætta leik</button></div>`;
  main.querySelectorAll(".plat").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.l)));
  document.getElementById("quit").addEventListener("click", end);
}

/* ---------- spurning ---------- */
function pick(l){
  const r = remaining(l);
  if(!r.length) return;
  S.q = r[Math.floor(Math.random()*r.length)];
  S.wrong = 0;
  renderQ();
}

function renderQ(){
  const q = S.q;
  const ui = q.type==="num"
    ? `<form id="f" class="ans" novalidate>
         <label for="a">Svarið þitt</label>
         <div class="row">
           <input id="a" inputmode="decimal" autocomplete="off" placeholder="t.d. 12,5 ${q.unit}">
           <button class="btn" type="submit" id="chk">Athuga svar</button>
         </div>
         <p class="small">Notaðu g = 9,8 m/s². Þú mátt skrifa eininguna með.</p>
         <p class="msg" id="msg" aria-live="polite"></p>
       </form>`
    : `<div class="opts" role="group" aria-label="Svarmöguleikar">
         ${q.options.map(o=>`<button class="opt" data-v="${o.v}">${o.t}</button>`).join("")}
       </div>`;
  main.innerHTML = `
    <div style="${lvStyle(q.level)}">
      <div class="qhead">
        <span class="chip">${q.level} stig</span>
        <button class="link" id="back">Velja annað stig</button>
      </div>
      <p class="qtext">${q.text}</p>
      ${ui}
      <div id="fb" aria-live="polite"></div>
    </div>`;
  document.getElementById("back").addEventListener("click", home);
  if(q.type==="num"){
    const inp = document.getElementById("a");
    inp.focus();
    document.getElementById("f").addEventListener("submit", e=>{
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.textContent = "";
      if(!inp.value.trim()){ msg.textContent = "Skrifaðu svar áður en þú athugar það."; return; }
      const v = parseNum(inp.value);
      if(isNaN(v)){ msg.textContent = "Engin tala fannst í svarinu. Skrifaðu til dæmis 12,5."; return; }
      q.answers.some(a=>Math.abs(v-a) <= Math.abs(a)*TOL) ? right() : wrong();
    });
  } else {
    main.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      if(b.dataset.v===q.correct){ b.classList.add("right"); right(); }
      else { b.classList.add("wrong"); b.disabled = true; wrong(); }
    }));
  }
}

function parseNum(s){
  s = s.replace(/\u2212/g,"-");
  const m = s.match(/-?\d[\d\s.,]*/);
  if(!m) return NaN;
  let t = m[0].replace(/\s+/g,"").replace(/[.,]+$/,"");
  if(/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,"");   // 11.400 → 11400
  t = t.replace(/,/g,".");
  if((t.match(/\./g)||[]).length > 1) return NaN;
  return parseFloat(t);
}

function lockAnswer(){
  main.querySelectorAll("#a,#chk,.opt").forEach(el=>el.disabled = true);
}

function right(){
  const q = S.q;
  S.score += q.level; S.used.add(q.id); S.log.push({q, ok:true});
  lockAnswer(); updateScore();
  document.getElementById("fb").innerHTML = `
    <div class="fb ok">
      <p class="big">Rétt! +${q.level} stig</p>
      <p class="sol">${q.sol}</p>
      <button class="btn" id="next">Áfram</button>
    </div>`;
  bindNext();
}

function wrong(){
  const q = S.q;
  S.wrong++;
  const i = Math.min(S.wrong, q.hints.length);
  document.getElementById("fb").innerHTML = `
    <div class="fb bad">
      <p class="big">Ekki rétt. Reyndu aftur.</p>
      <div class="hint"><strong>Vísbending ${q.hints.length>1 ? i+" af "+q.hints.length : ""}</strong><p>${q.hints[i-1]}</p></div>
      <button class="btn ghost" id="reveal">Sýna lausn og fá 0 stig</button>
    </div>`;
  document.getElementById("reveal").addEventListener("click", reveal);
  const inp = document.getElementById("a");
  if(inp){ inp.select(); inp.focus(); }
}

function reveal(){
  const q = S.q;
  S.used.add(q.id); S.log.push({q, ok:false});
  lockAnswer(); updateScore();
  if(q.type==="choice") main.querySelector(`.opt[data-v="${q.correct}"]`).classList.add("right");
  document.getElementById("fb").innerHTML = `
    <div class="fb">
      <p class="big">Lausn</p>
      <p class="sol">${q.sol}</p>
      <button class="btn" id="next">Áfram</button>
    </div>`;
  bindNext();
}

function bindNext(){
  const n = document.getElementById("next");
  n.addEventListener("click", home);
  n.focus();
}

/* ---------- lok ---------- */
function end(){
  const rows = [1,3,5].map(l=>{
    const e = S.log.filter(x=>x.q.level===l);
    const ok = e.filter(x=>x.ok).length;
    return `<tr style="${lvStyle(l)}"><td><span class="dot"></span>${l} stig</td><td>${ok}</td><td>${e.length}</td><td>${ok*l}</td></tr>`;
  }).join("");
  const left = [1,3,5].some(l=>remaining(l).length);
  main.innerHTML = `
    <h1>Leik lokið</h1>
    <p class="total"><span class="n">${S.score}</span><span>stig</span></p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Erfiðleikastig</th><th>Rétt</th><th>Svarað</th><th>Stig</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${S.log.length ? `<ol class="log">${S.log.map(x=>`
      <li><span class="${x.ok?'ok':'no'}" aria-label="${x.ok?'Rétt':'Rangt'}">${x.ok?'✓':'✗'}</span>
      <span class="lv">${x.q.level} stig</span><span>${x.q.text.length>90 ? x.q.text.slice(0,88)+'…' : x.q.text}</span></li>`).join("")}</ol>` : ""}
    <div class="actions">
      ${left ? '<button class="btn" id="cont">Halda áfram að spila</button>' : ''}
      <button class="btn ghost" id="restart">Byrja upp á nýtt</button>
    </div>`;
  const c = document.getElementById("cont");
  if(c) c.addEventListener("click", home);
  document.getElementById("restart").addEventListener("click", ()=>{
    S.score = 0; S.log = []; S.used = new Set(); updateScore(); home();
  });
}

home();
</script>
</body>
</html>
